[package]
name = "ua-stress-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
bincode = "1"
serde = { version = "1", features = ["derive"] }
once_cell = "1"
bzip2-rs = "0.1"   # pure Rust — works on all targets including wasm32

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
# used by integration tests to exercise the dictionary with real data
serde_json = "1"
