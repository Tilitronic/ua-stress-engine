name: Build and Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "PyPI repository (testpypi or pypi)"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test-wheel:
    name: Test wheel on ${{ matrix.os }}
    needs: [build-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-${{ matrix.os }}-*
          path: dist
          merge-multiple: true

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/ua_stress_engine-*-cp$(echo ${{ matrix.python-version }} | tr -d '.')*-*.whl

      - name: Test basic functionality
        shell: python
        run: |
          import ukrainian_stress

          # Test mark function
          result = ukrainian_stress.mark('мама')
          assert result == 'ма́ма', f"Expected 'ма́ма', got '{result}'"
          print(f"✓ mark('мама') = {result}")

          # Test word_count function
          count = ukrainian_stress.word_count()
          assert count > 0, f"Expected word_count > 0, got {count}"
          print(f"✓ word_count() = {count}")

          # Test lookup function
          lookup_result = ukrainian_stress.lookup('мама')
          assert 'readings' in lookup_result, "lookup result missing 'readings'"
          assert len(lookup_result['readings']) > 0, "lookup returned no readings"
          print(f"✓ lookup('мама') returned {len(lookup_result['readings'])} reading(s)")

          print("\n✅ All tests passed!")

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, test-wheel]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || inputs.repository }}
      url: ${{ github.event_name == 'release' && 'https://pypi.org/p/ua-stress-engine' || 'https://test.pypi.org/p/ua-stress-engine' }}
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: List files to publish
        run: ls -lh dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --skip-existing dist/*
        env:
          MATURIN_REPOSITORY: testpypi
          MATURIN_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}

      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Create upload summary
        run: |
          echo "## 🎉 Published to PyPI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Package: **ua-stress-engine**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "release" ] || [ "${{ inputs.repository }}" == "pypi" ]; then
            echo "pip install ua-stress-engine" >> $GITHUB_STEP_SUMMARY
          else
            echo "pip install -i https://test.pypi.org/simple/ ua-stress-engine" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files published" >> $GITHUB_STEP_SUMMARY
          ls -1 dist/ >> $GITHUB_STEP_SUMMARY
