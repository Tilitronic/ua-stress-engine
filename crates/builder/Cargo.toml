[package]
name = "builder"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[[bin]]
name = "builder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bincode = "1"
bzip2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"                     # for parsing stress_indices_json column
rusqlite = { version = "0.32", features = ["bundled"] }   # read master SQLite DB
ua-stress-core = { path = "../core" }
