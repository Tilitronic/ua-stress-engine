[package]
name = "builder"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-or-later"

[[bin]]
name = "builder"
path = "src/main.rs"

# Standalone binary: emits JSON Schema for all public API response types to stdout.
# Usage: cargo run -p builder --bin schema-export > packages/ua-stress-web/src/generated/schema.json
[[bin]]
name = "schema-export"
path = "src/schema_export.rs"

[dependencies]
anyhow = "1"
bincode = "1"
bzip2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"                     # for parsing stress_indices_json column
rusqlite = { version = "0.32", features = ["bundled"] }   # read master SQLite DB
schemars = "0.8"                     # JSON Schema generation (schema-export binary)
ua-stress-core = { path = "../core", features = ["schema"] }
