[package]
name = "ua-stress-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

# wasm-opt fails to validate the large embedded binary blob (ua_stress.bin.bz2).
# Disable it — the binary is already optimized by rustc with opt-level=3 + lto.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ua-stress-core = { path = "../core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

